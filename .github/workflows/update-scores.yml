name: Update Tournament Scores

on:
  schedule:
    # Run every 2 minutes during tournament hours (noon-midnight ET = 16:00-04:00 UTC)
    - cron: '*/2 16-23 * * *'   # 4pm-11:59pm UTC (noon-7:59pm ET)
    - cron: '*/2 0-4 * * *'     # midnight-4am UTC (8pm-midnight ET)
  workflow_dispatch:              # Allow manual trigger from GitHub Actions tab

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run score updater
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python scripts/update_scores.py
